{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main_class %}container auth-wrap{% endblock %}
{% block content %}
<section class="panel auth-card" aria-labelledby="login-title">
  <p class="eyebrow">Step 1 of 2</p>
  <h1 id="login-title">Sign in</h1>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field">
      <span>Username</span>
      <input name="username" value="{{ username }}" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" required maxlength="200" autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block" data-loading-text="Checking…">Continue</button>
  </form>
</section>
{% endblock %}
