{% macro avatar(emp) -%}
{%- set c = emp.color -%}
<svg class="avatar avatar-{{ emp.avatar_style }}" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
  <ellipse class="av-shadow" cx="60" cy="112" rx="40" ry="5" fill="#000" opacity=".35"/>
  <g class="av-body">
    {%- if emp.avatar_style == 'antenna' %}
    <g class="av-head">
      <line x1="60" y1="22" x2="60" y2="9" stroke="{{ c }}" stroke-width="3" stroke-linecap="round"/>
      <circle class="av-antenna-tip" cx="60" cy="8" r="5" fill="#22D3EE"/>
      <circle cx="60" cy="44" r="23" fill="{{ c }}"/>
      <circle cx="60" cy="44" r="23" fill="#fff" opacity=".08"/>
      <rect x="44" y="36" width="32" height="15" rx="7.5" fill="#0B1222"/>
      <circle class="av-eye" cx="53" cy="43.5" r="3" fill="#22D3EE"/>
      <circle class="av-eye" cx="67" cy="43.5" r="3" fill="#22D3EE"/>
    </g>
    <path d="M30 96 Q30 70 60 70 Q90 70 90 96 Z" fill="{{ c }}"/>
    {%- elif emp.avatar_style == 'headset' %}
    <g class="av-head">
      <rect x="38" y="22" width="44" height="42" rx="12" fill="{{ c }}"/>
      <rect x="38" y="22" width="44" height="42" rx="12" fill="#fff" opacity=".08"/>
      <path d="M34 44 Q34 14 60 14 Q86 14 86 44" fill="none" stroke="#1B2236" stroke-width="5" stroke-linecap="round"/>
      <rect x="29" y="36" width="10" height="17" rx="4" fill="#1B2236"/>
      <rect x="81" y="36" width="10" height="17" rx="4" fill="#1B2236"/>
      <path d="M34 52 Q36 64 50 62" fill="none" stroke="#1B2236" stroke-width="3" stroke-linecap="round"/>
      <circle cx="51" cy="62" r="3.5" fill="#22D3EE"/>
      <circle class="av-eye" cx="51" cy="41" r="3.2" fill="#0B1222"/>
      <circle class="av-eye" cx="69" cy="41" r="3.2" fill="#0B1222"/>
      <path d="M54 51 Q60 55 66 51" fill="none" stroke="#0B1222" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <path d="M28 96 Q28 70 60 70 Q92 70 92 96 Z" fill="{{ c }}"/>
    {%- elif emp.avatar_style == 'glasses' %}
    <g class="av-head">
      <ellipse cx="60" cy="40" rx="19" ry="26" fill="{{ c }}"/>
      <ellipse cx="60" cy="40" rx="19" ry="26" fill="#fff" opacity=".08"/>
      <path d="M44 22 Q60 6 76 22 Q68 17 60 18 Q52 17 44 22 Z" fill="#0B1222" opacity=".55"/>
      <circle cx="52" cy="40" r="7" fill="#0B1222" opacity=".25" stroke="#E6FBFF" stroke-width="2.4"/>
      <circle cx="68" cy="40" r="7" fill="#0B1222" opacity=".25" stroke="#E6FBFF" stroke-width="2.4"/>
      <line x1="59" y1="40" x2="61" y2="40" stroke="#E6FBFF" stroke-width="2.4"/>
      <circle class="av-eye" cx="52" cy="40" r="2.4" fill="#0B1222"/>
      <circle class="av-eye" cx="68" cy="40" r="2.4" fill="#0B1222"/>
      <path d="M55 53 Q60 56 65 53" fill="none" stroke="#0B1222" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <path d="M34 96 Q34 70 60 70 Q86 70 86 96 Z" fill="{{ c }}"/>
    {%- elif emp.avatar_style == 'cap' %}
    <g class="av-head">
      <rect x="31" y="27" width="58" height="38" rx="18" fill="{{ c }}"/>
      <rect x="31" y="27" width="58" height="38" rx="18" fill="#fff" opacity=".08"/>
      <path d="M33 34 Q34 14 60 14 Q86 14 87 34 Z" fill="#1B2236"/>
      <path d="M60 32 L100 32 Q102 38 94 38 L60 38 Z" fill="#1B2236"/>
      <circle cx="60" cy="16" r="2.6" fill="#22D3EE"/>
      <circle class="av-eye" cx="49" cy="46" r="3.4" fill="#0B1222"/>
      <circle class="av-eye" cx="71" cy="46" r="3.4" fill="#0B1222"/>
      <path d="M52 55 Q60 60 68 55" fill="none" stroke="#0B1222" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <path d="M26 96 Q26 70 60 70 Q94 70 94 96 Z" fill="{{ c }}"/>
    {%- else %}
    <g class="av-head">
      <path d="M40 46 Q38 20 60 20 Q84 20 81 46 Q79 66 60 66 Q42 66 40 46 Z" fill="{{ c }}"/>
      <path d="M40 46 Q38 20 60 20 Q84 20 81 46 Q79 66 60 66 Q42 66 40 46 Z" fill="#fff" opacity=".08"/>
      <path d="M33 46 Q31 10 60 10 Q89 10 87 46" fill="none" stroke="#1B2236" stroke-width="6" stroke-linecap="round"/>
      <rect x="26" y="36" width="15" height="22" rx="7" fill="#1B2236"/>
      <rect x="79" y="36" width="15" height="22" rx="7" fill="#1B2236"/>
      <rect x="30" y="41" width="6" height="12" rx="3" fill="#22D3EE"/>
      <rect x="84" y="41" width="6" height="12" rx="3" fill="#22D3EE"/>
      <circle class="av-eye" cx="52" cy="42" r="3.2" fill="#0B1222"/>
      <circle class="av-eye" cx="68" cy="42" r="3.2" fill="#0B1222"/>
      <path d="M54 52 Q60 56 66 52" fill="none" stroke="#0B1222" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <path d="M30 96 Q30 70 60 70 Q90 70 90 96 Z" fill="{{ c }}"/>
    {%- endif %}
  </g>
  <g class="av-desk">
    <rect class="av-screen" x="36" y="80" width="48" height="22" rx="3" fill="#0E1729" stroke="#22D3EE" stroke-opacity=".5"/>
    <rect class="av-screen-glow" x="40" y="84" width="40" height="14" rx="2" fill="#22D3EE" opacity=".12"/>
    <rect x="20" y="102" width="80" height="6" rx="3" fill="#1B2236"/>
  </g>
  <circle class="av-hand av-hand-l" cx="40" cy="101" r="5.5" fill="{{ c }}" stroke="#070B14" stroke-width="1.5"/>
  <circle class="av-hand av-hand-r" cx="80" cy="101" r="5.5" fill="{{ c }}" stroke="#070B14" stroke-width="1.5"/>
</svg>
{%- endmacro %}
